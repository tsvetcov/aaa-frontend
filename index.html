<!DOCTYPE html>
<html>
<head>
    <title>Форма для загрузки</title>
<style>
    .mistake {
      color: red; font-weight: 800; background: lightgray;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
    table {
    border-collapse: collapse;
    margin: 15px auto;
    text-align: center;
    }
    td, th {
    border: 2px solid black;
    padding: 5px;
    }
    </style>

</head>
<body>
    <h1 style="text-align: center;">Это форма для загрузки файла</h1>
    <p class="mistake">Произошла ошибка 404.</p>
    <div style="text-align: center;">
    <img src="https://ru.hostings.info/upload/images/2021/12/e11044b915dc39afc3004430606bd6d1.jpg" alt="Image for 404 error" width="300" height="200">
    <form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/jpeg"/>
    <button type="submit">
      Загрузить файл
    </button>
    </form>
    </div>
<table>
  <tr>
    <th>Название модели</th>
    <th>Эпоха</th>
    <th>F-score</th>
  </tr>
  <tr>
    <td>baseline</td>
    <td>1</td>
    <td>0.1</td>
  </tr>
</table>
</body>
</html>
